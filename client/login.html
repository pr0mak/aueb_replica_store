<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AUEB Official Store</title>

    <link rel="stylesheet" href="/styles/style.css">

    <script src="js/custom_alert.js" defer></script>

    <script src="js/login.js" defer></script>
</head>

<body>
    <div class="container">

        <header>
            <div class="header-top">
                <table class="aueb-profile">
                    <tr>
                        <th class="logo">
                            <a href="index.html" aria-label="Αρχική σελίδα">
                                <img src="/assets/aueb_logo.jpg" alt="Λογότυπο Οικονομικού Πανεπιστημίου Αθηνών">
                            </a>
                        </th>
                    </tr>
                </table>

                <div class="header-actions">
                    <a href="register.html" class="login-link">Register</a>
                </div>
            </div>

            <nav aria-label="Κεντρικό μενού">
                <ul>
                    <li><a href="index.html">Αρχική</a></li>
                    <li><a href="store.html">Κατάστημα</a></li>
                    <li><a href="buy.html">Παραγγελία</a></li>
                    <li><a href="contact.html">Επικοινωνία</a></li>
                    <li id="adminLink" class="admin-only hidden">
                        <a href="admin.html">Admin Panel</a>
                    </li>
                </ul>
            </nav>
        </header>

        <main class="login-main">
            <section class="login-card">
                <h1>Σύνδεση χρήστη</h1>

                <p>Καλώς ήρθες στο AUEB Official Store!</p>

                <form class="form" id="loginForm" action="#" method="post" novalidate>
                    <section>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required placeholder="example@gmail.com" autocomplete="email">
                    </section>

                    <section>
                        <label for="password">Κωδικός πρόσβασης:</label>
                        <input type="password" id="password" name="password" placeholder="Πληκτρολόγησε τον κωδικό σου" autocomplete="current-password">
                    </section>

                    <div class="buttons">
                        <input type="submit" value="Σύνδεση">
                        <input type="reset" value="Καθαρισμός">
                    </div>

                    <p class="back-home">
                        <a href="index.html">Επιστροφή στην αρχική σελίδα</a>
                    </p>
                </form>
            </section>
        </main>

        <footer>
            <div class="first-column">
                <h3>&copy; 2026 AUEB Official Store</h3>
                <p>
                    <a href="https://www.shop.aueb.gr/">
                    Επίσημη ιστοσελίδα AUEB
                </a>
                </p>
            </div>

            <div class="third-column">
                <h3>Οικονομικό Πανεπιστήμιο Αθηνών</h3>
                <p>Πατησίων 76, Αθήνα</p>
            </div>

            <div class="design">
                <p>Σχεδίαση: AuebStore.</p>
            </div>
        </footer>

    </div>

    <!-- custom alert-->
    <div id="customAlert" class="modal-overlay hidden">
        <div class="modal-box">
            <p id="alertMessage"></p>
            <button id="alertOkBtn">Εντάξει</button>
        </div>
    </div>

</body>

</html>
